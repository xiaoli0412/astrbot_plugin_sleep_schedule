<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>作息表</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#242a35;--text:#e8ecf3;
        --muted:#8b95a7;--accent:#6ea8fe;--ok:#3fb950;--warn:#d29922;--night:#8b7fd4}
  @media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--panel:#fff;
        --line:#e3e6ec;--text:#1a1d23;--muted:#6b7280;--accent:#2563eb}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",
            "PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:880px;margin:0 auto;padding:20px}
  header{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
  h1{font-size:19px;margin:0;font-weight:650}
  .sub{color:var(--muted);font-size:12.5px}
  .hero{background:var(--panel);border:1px solid var(--line);border-radius:13px;
        padding:20px;margin-bottom:16px;display:flex;align-items:center;gap:16px}
  .dot{width:13px;height:13px;border-radius:50%;flex:0 0 auto}
  .dot.awake{background:var(--ok);box-shadow:0 0 0 4px rgba(63,185,80,.16)}
  .dot.asleep{background:var(--night);box-shadow:0 0 0 4px rgba(139,127,212,.16)}
  .hero .big{font-size:22px;font-weight:650}
  .hero .small{color:var(--muted);font-size:12.5px;margin-top:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
        gap:10px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;
        padding:12px 15px}
  .stat .k{color:var(--muted);font-size:11.5px;margin-bottom:3px}
  .stat .v{font-size:20px;font-weight:650}
  h2{font-size:14px;margin:20px 0 10px;font-weight:620;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;
        padding:12px 15px;margin-bottom:8px}
  .row{display:flex;align-items:center;gap:9px;font-size:13px;margin-bottom:6px}
  .badge{font-size:11px;padding:1.5px 7px;border-radius:5px;
         background:rgba(110,168,254,.14);color:var(--accent);font-weight:600}
  .msg{color:var(--muted);font-size:12.5px;padding:3px 0 3px 10px;
       border-left:2px solid var(--line);margin:3px 0}
  .empty{color:var(--muted);text-align:center;padding:26px 0;font-size:13px}
  .bar{display:flex;gap:8px}
  button{padding:9px 16px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);cursor:pointer;font-size:13.5px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#fff;border-color:transparent}
  .foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>作息表</h1><span class="sub" id="conn">连接中…</span></header>

  <div class="hero">
    <div class="dot" id="dot"></div>
    <div>
      <div class="big" id="state">—</div>
      <div class="small" id="stateSub"></div>
    </div>
  </div>

  <div class="grid" id="stats"></div>

  <div class="bar" style="margin-bottom:16px">
    <button class="primary" id="replay">立即回放</button>
    <button id="refresh">刷新</button>
  </div>

  <h2>待回放的留言</h2>
  <div id="sessions"><div class="empty">没有待回放的留言</div></div>

  <div class="foot">睡着时收到的消息会暂存到这里，醒来后一次性回复。</div>
</div>

<script type="module">
const PLUGIN_ID = "astrbot_plugin_sleep_schedule";
const bridge = window.AstrBotPluginView || window.AstrBotPluginPage;
const el = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function apiGet(ep) {
  const p = await bridge.apiGet(`${PLUGIN_ID}/${ep}`);
  if (p && p.ok === false) throw new Error(p.error || "请求失败");
  return p && Object.prototype.hasOwnProperty.call(p, "data") ? p.data : p;
}
async function apiPost(ep, body) {
  const p = await bridge.apiPost(`${PLUGIN_ID}/${ep}`, body || {});
  if (p && p.ok === false) throw new Error(p.error || "操作失败");
  return p || {};
}

function render(d) {
  const dot = el("dot");
  dot.className = "dot " + (d.asleep ? "asleep" : "awake");
  el("state").textContent = d.asleep ? "睡着中 🌙" : "清醒 ☀️";
  el("stateSub").textContent = `窗口 ${d.sleep_window} · 现在 ${d.now}`;

  el("stats").innerHTML = `
    <div class="stat"><div class="k">插件状态</div><div class="v">${d.enabled ? "开启" : "关闭"}</div></div>
    <div class="stat"><div class="k">待回放</div><div class="v">${d.pending_total ?? 0} <small style="font-size:12px;font-weight:400">条</small></div></div>
    <div class="stat"><div class="k">醒来回放</div><div class="v">${d.replay_on_wake ? "是" : "否"}</div></div>
    <div class="stat"><div class="k">回放模型</div><div class="v" style="font-size:13px;word-break:break-all">${esc(d.replay_provider_id || "会话默认")}</div></div>`;

  const ss = d.sessions || [];
  el("sessions").innerHTML = ss.length ? ss.map(s => `
    <div class="card">
      <div class="row"><span class="badge">${s.count} 条</span>
        <span style="color:var(--muted);font-size:12px">${esc(s.umo)}</span></div>
      ${(s.items || []).map(it => `<div class="msg">${esc(it.ts)}　${esc(it.text)}</div>`).join("")}
    </div>`).join("") : `<div class="empty">没有待回放的留言</div>`;
}

async function load() {
  try { el("conn").textContent = "已连接"; render(await apiGet("overview")); }
  catch (e) { el("conn").textContent = "连接失败"; }
}

async function boot() {
  if (!bridge) { el("conn").textContent = "bridge 未加载"; return; }
  await bridge.ready();
  await load();
  el("refresh").onclick = load;
  el("replay").onclick = async () => {
    if (!confirm("现在把所有待回放的留言发出去？")) return;
    try {
      const r = await apiPost("replay");
      alert(`已回放 ${r.data?.replayed ?? 0} 个会话`);
      load();
    } catch (e) { alert("回放失败：" + e.message); }
  };
  setInterval(load, 15000);
}
boot();
</script>
</body>
</html>
